packages:
  - "packages/*"

catalogs:
  # v10 plus the latest published services. The `next` dist-tags are behind those
  # releases (and behind upstream main); see the `next` catalog.
  default:
    electron: 37.10.3
    webdriverio: ^10.2.0
    "@wdio/cli": ^10.2.0
    "@wdio/globals": ^10.2.0
    "@wdio/local-runner": ^10.2.0
    "@wdio/mocha-framework": ^10.2.0
    "@wdio/types": ^10.2.0
    "@wdio/logger": ^10.2.0
    "@wdio/display-server": ^10.2.0
    "@wdio/visual-service": ^11.0.0
    "@wdio/electron-service": latest
    "@wdio/tauri-service": latest
    "@wdio/tauri-plugin": latest
    # 1.0.0-next.4 is older than 1.1.0, so `latest` is the build to test.
    "@wdio/dioxus-service": latest
    # No `next` tag; 0.3.1 peers on WebdriverIO ^9.
    "@wdio/electrobun-service": latest
    # `latest` is the 0.0.1 placeholder. The prerelease is the real build.
    "@wdio/react-native-service": next
    "@wdio/flutter-service": next
    "@wdio/native-types": ^2.6.1
    "@wdio/native-utils": latest
    "@wdio/appium-service": ^10.2.0
    appium: ^3.5.0
    wdio-video-reporter: 6.2.0
    "@tauri-apps/api": 2.12.4
    "@tauri-apps/cli": 2.12.4
    "@tauri-apps/plugin-deep-link": 2.6.3
    "@tauri-apps/plugin-log": 2.10.1
    "@crabnebula/tauri-driver": ^2.0.9
    "@crabnebula/test-runner-backend": ^0.2.8
  # v10 plus `next` dist-tags. Several of those tags are older than `latest`
  # and none of them carry upstream main (727f8c3) yet.
  next:
    electron: latest
    webdriverio: next
    "@wdio/cli": next
    "@wdio/globals": next
    "@wdio/local-runner": next
    "@wdio/mocha-framework": next
    "@wdio/types": next
    "@wdio/logger": next
    "@wdio/display-server": next
    "@wdio/visual-service": latest
    "@wdio/electron-service": next
    "@wdio/tauri-service": next
    "@wdio/tauri-plugin": next
    "@wdio/dioxus-service": latest
    "@wdio/electrobun-service": latest
    "@wdio/react-native-service": next
    "@wdio/flutter-service": next
    "@wdio/native-types": ^2.6.1
    "@wdio/native-utils": next
    "@wdio/appium-service": next
    appium: latest
    wdio-video-reporter: 6.2.0
    "@tauri-apps/api": latest
    "@tauri-apps/cli": latest
    "@tauri-apps/plugin-deep-link": latest
    "@tauri-apps/plugin-log": latest
    "@crabnebula/tauri-driver": latest
    "@crabnebula/test-runner-backend": ^0.2.8
  # v9 floor. Only the packages whose major differs from `default` live here, so
  # `switch-catalog.ts minimum --wdio-only` leaves the service builds alone.
  minimum:
    webdriverio: ^9.33.0
    "@wdio/cli": ^9.33.0
    "@wdio/globals": ^9.33.0
    "@wdio/local-runner": ^9.33.0
    "@wdio/mocha-framework": ^9.33.0
    "@wdio/types": ^9.33.0
    "@wdio/logger": ^9.33.0
    "@wdio/xvfb": ^9.33.0
    "@wdio/visual-service": ^10.0.0
    "@wdio/appium-service": ^9.33.0
