name: CI (reusable)

# Shared test matrix. Callers pass a catalog (default or next) and a WebdriverIO
# major. The v9 leg then runs `switch-catalog.ts minimum --wdio-only`, so both
# majors share the caller's service builds.
on:
  workflow_call:
    inputs:
      catalog:
        description: 'pnpm catalog for the service builds (default | next)'
        type: string
        default: default
      wdio-major:
        description: 'WebdriverIO major to run (v10 | v9)'
        type: string
        default: v10
      runner-set:
        description: 'x64 keeps ubuntu-latest and windows-latest. arm64 maps those to ubuntu-24.04-arm and windows-11-arm and skips macOS, mobile, and CrabNebula.'
        type: string
        default: x64

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Electron — three packages × test types
  # ────────────────────────────────────────────────────────────────────
  electron:
    name: electron-${{ matrix.package }}-${{ matrix.test-type }} ${{ inputs.wdio-major }} (${{ matrix.os }})
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    strategy:
      matrix:
        # macOS runners are already arm64 in ci.yml, so the arm64 set drops them.
        # Job-level if cannot read matrix, so the skip has to be the os list itself.
        os: ${{ inputs.runner-set == 'arm64' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node-version: ["24"]
        package: [builder, forge, script]
        test-type: [standard, multiremote, deeplink, standalone, window, visual, video]
        exclude:
          # The electron-script app has no testapp:// protocol handler — upstream
          # only wires deeplinks into the builder + forge fixtures.
          - { package: script, test-type: deeplink }
      fail-fast: false

    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - name: 🔧 Apply Linux Kernel Workaround
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      # v9 keeps the caller's service builds and only moves webdriverio + @wdio/* onto the v9 floor.
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      # Linux deeplink and multiremote tests need the testapp:// protocol registered
      # with xdg-mime, which requires the packaged binary to exist on disk first.
      # electron-script has no protocol handler. macOS registers at launch.
      - name: Build app for protocol registration (Linux)
        if: ${{ (matrix.test-type == 'deeplink' || matrix.test-type == 'multiremote') && matrix.package != 'script' && runner.os == 'Linux' }}
        run: pnpm --filter=@wdio-desktop-mobile-example/electron-${{ matrix.package }} run build
      - name: Register testapp:// protocol handler (Linux)
        if: ${{ (matrix.test-type == 'deeplink' || matrix.test-type == 'multiremote') && matrix.package != 'script' && runner.os == 'Linux' }}
        run: bash packages/electron-${{ matrix.package }}/scripts/protocol-install.sh
      - name: Run Electron tests
        if: ${{ !(inputs.wdio-major == 'v9' && runner.os == 'Linux') }}
        run: pnpm run test:electron-${{ matrix.package }}:${{ matrix.test-type }}
      # display-server 9.32.0 ships no build, so the drivers the launcher spawns need a job-wide Xvfb.
      # https://github.com/webdriverio/desktop-mobile/pull/1011
      - name: Run Electron tests (v9, job-wide Xvfb)
        if: ${{ inputs.wdio-major == 'v9' && runner.os == 'Linux' }}
        run: xvfb-run -a pnpm run test:electron-${{ matrix.package }}:${{ matrix.test-type }}
      - name: 🐛 Show Test Logs on Failure
        shell: bash
        if: failure()
        run: pnpm --filter=@wdio-desktop-mobile-example/electron-${{ matrix.package }} run ci:logs

  # ────────────────────────────────────────────────────────────────────
  # Dioxus — all OS × test types (single embedded provider)
  # ────────────────────────────────────────────────────────────────────
  dioxus:
    name: dioxus-${{ matrix.test-type }} ${{ inputs.wdio-major }} (${{ matrix.os }})
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.runner-set == 'arm64' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node-version: ["24"]
        # visual is omitted: the embedded driver refuses screenshots.
        # https://github.com/webdriverio/desktop-mobile/issues/741
        test-type: [standard, multiremote, deeplink, standalone, window, video]
      fail-fast: false

    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/dioxus
      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            xvfb
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      # v9 keeps the caller's service builds and only moves webdriverio + @wdio/* onto the v9 floor.
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      - name: Run Dioxus tests (Linux)
        if: ${{ runner.os == 'Linux' }}
        env:
          NO_AT_BRIDGE: '1'
          RUST_BACKTRACE: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x16" pnpm run test:dioxus:${{ matrix.test-type }}
      - name: Run Dioxus tests
        if: ${{ runner.os != 'Linux' }}
        env:
          RUST_BACKTRACE: '1'
        run: pnpm run test:dioxus:${{ matrix.test-type }}
      - name: 🐛 Show Test Logs on Failure
        shell: bash
        if: failure()
        run: pnpm --filter=@wdio-desktop-mobile-example/dioxus run ci:logs

  # ────────────────────────────────────────────────────────────────────
  # Tauri Embedded — all OS × test types
  # ────────────────────────────────────────────────────────────────────
  tauri-embedded:
    name: tauri-embedded-${{ matrix.test-type }} ${{ inputs.wdio-major }} (${{ matrix.os }})
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.runner-set == 'arm64' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node-version: ["24"]
        test-type: [standard, multiremote, deeplink, standalone, window, visual, video]
      fail-fast: false

    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tauri
      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libsoup-3.0-dev libssl-dev libasound2-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb xdg-utils
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      # v9 keeps the caller's service builds and only moves webdriverio + @wdio/* onto the v9 floor.
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      - name: Build Tauri app for protocol registration
        if: ${{ (matrix.test-type == 'deeplink' || matrix.test-type == 'multiremote') && runner.os != 'macOS' }}
        run: pnpm --filter=@wdio-desktop-mobile-example/tauri run build
      - name: Register testapp:// protocol handler
        if: ${{ (matrix.test-type == 'deeplink' || matrix.test-type == 'multiremote') && runner.os != 'macOS' }}
        run: bash packages/tauri/scripts/protocol-install.sh
      - name: Run Tauri embedded tests (Linux)
        if: ${{ runner.os == 'Linux' }}
        env:
          NO_AT_BRIDGE: '1'
          RUST_BACKTRACE: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x16" pnpm run test:tauri:embedded:${{ matrix.test-type }}
      - name: Run Tauri embedded tests
        if: ${{ runner.os != 'Linux' }}
        env:
          RUST_BACKTRACE: '1'
        run: pnpm run test:tauri:embedded:${{ matrix.test-type }}
      - name: 🐛 Show Test Logs on Failure
        shell: bash
        if: failure()
        run: pnpm --filter=@wdio-desktop-mobile-example/tauri run ci:logs

  # ────────────────────────────────────────────────────────────────────
  # Tauri Official — Linux/Windows only × test types
  # ────────────────────────────────────────────────────────────────────
  tauri-external:
    name: tauri-external-${{ matrix.test-type }} ${{ inputs.wdio-major }} (${{ matrix.os }})
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["24"]
        test-type: [standard, multiremote, deeplink, standalone, window, visual, video]
        exclude:
          # On Linux+external (tauri-driver + WebKitGTK), @wdio/visual-service's
          # before() hook calls browser.execute('return window.devicePixelRatio'),
          # which gets wrapped by @wdio/tauri-service's patchedExecute into an
          # executeAsync HTTP call. That call hangs and times out after ~2 min,
          # leaving the visual-service commands unregistered ("checkScreen is
          # not a function"). Suspected interaction between WebKitWebDriver +
          # the patched-execute wrapping; needs an upstream investigation.
          - { os: ubuntu-latest, test-type: visual }
      fail-fast: false

    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tauri
      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          # Ubuntu 26.04 replaced webkit2gtk-driver with webkitgtk-webdriver.
          webdriver_pkg=webkit2gtk-driver
          if apt-cache policy webkitgtk-webdriver | grep "Candidate: [^(]" >/dev/null; then webdriver_pkg=webkitgtk-webdriver; fi
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libsoup-3.0-dev libssl-dev libasound2-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb xdg-utils "$webdriver_pkg"
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      # v9 keeps the caller's service builds and only moves webdriverio + @wdio/* onto the v9 floor.
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      - name: Build Tauri app for protocol registration
        if: ${{ (matrix.test-type == 'deeplink' || matrix.test-type == 'multiremote') && runner.os != 'macOS' }}
        run: pnpm --filter=@wdio-desktop-mobile-example/tauri run build
      - name: Register testapp:// protocol handler
        if: ${{ (matrix.test-type == 'deeplink' || matrix.test-type == 'multiremote') && runner.os != 'macOS' }}
        run: bash packages/tauri/scripts/protocol-install.sh
      - name: Run Tauri external tests (Linux)
        if: ${{ runner.os == 'Linux' }}
        env:
          NO_AT_BRIDGE: '1'
          RUST_BACKTRACE: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x16" pnpm run test:tauri:external:${{ matrix.test-type }}
      - name: Run Tauri external tests
        id: test
        if: ${{ runner.os == 'Windows' }}
        # Failure is gated below rather than here, so a known-broken platform
        # warns instead of going red. Linux has no continue-on-error and stays
        # required.
        continue-on-error: true
        env:
          RUST_BACKTRACE: '1'
        run: pnpm run test:tauri:external:${{ matrix.test-type }}
      - name: 🐛 Show Test Logs on Failure
        shell: bash
        if: ${{ failure() || steps.test.outcome == 'failure' }}
        # Diagnostic output must never decide the job result — that is Check
        # Result's job. Without this the log dump becomes the failure whenever
        # it cannot run, which is exactly what it does on Windows today.
        continue-on-error: true
        run: pnpm --filter=@wdio-desktop-mobile-example/tauri run ci:logs
      - name: ❌ Check Result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          # The external provider reaches WebView2 through msedgedriver on Windows,
          # where Runtime 150 stopped honouring --remote-debugging-port for elevated
          # hosts — and runners run as admin. Upstream fix: tauri-apps/wry#1782.
          # https://github.com/webdriverio/desktop-mobile/issues/542
          #
          # Empty outcome means the step was skipped for this OS (Linux runs its own
          # step, which is required and fails the job directly).
          case "$OUTCOME" in
            success|skipped|'')
              echo "Tauri external: $OUTCOME" ;;
            failure)
              if [ "$RUNNER_OS" = "Windows" ]; then
                echo "::warning::Tauri external tests failed (allowed on Windows — WebView2 150 elevated-host regression; see https://github.com/webdriverio/desktop-mobile/issues/542)"
              else
                echo "::error::Tauri external tests failed"
                exit 1
              fi ;;
            *)
              echo "::error::Tauri external tests had unexpected outcome: $OUTCOME"
              exit 1 ;;
          esac

  # ────────────────────────────────────────────────────────────────────
  # Tauri CrabNebula — all OS × test types
  # macOS requires CN_API_KEY (must be configured as a repo secret)
  # ────────────────────────────────────────────────────────────────────
  tauri-crabnebula:
    name: tauri-crabnebula-${{ matrix.test-type }} ${{ inputs.wdio-major }} (${{ matrix.os }})
    if: inputs.runner-set != 'arm64'
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    env:
      # Dependabot-triggered runs receive no repository secrets, so CN_API_KEY
      # is empty there. Evaluate its presence into a boolean here (without
      # exposing the value to every step) so the macOS run below — the only
      # cell that requires the key — can be skipped on dependabot PRs.
      HAS_CN_API_KEY: ${{ secrets.CN_API_KEY != '' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["24"]
        test-type: [standard, multiremote, deeplink, standalone, window, visual, video]
        exclude:
          # CrabNebula's macOS driver captures via OS-level Screen Recording
          # (AVFoundation / ScreenCaptureKit). GitHub-hosted macOS runners
          # have no way to grant Screen Recording permission to the runner
          # process programmatically, so visual tests time out / error.
          # Local macOS works (one-time prompt). Document this limitation.
          - { os: macos-latest, test-type: visual }
          # `wdio-video-reporter` captures via per-command screenshots, which
          # on CrabNebula+macOS go through the same Screen Recording path as
          # the visual cell — same TCC permission limitation applies.
          - { os: macos-latest, test-type: video }
      fail-fast: false

    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tauri
      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          # Ubuntu 26.04 replaced webkit2gtk-driver with webkitgtk-webdriver.
          webdriver_pkg=webkit2gtk-driver
          if apt-cache policy webkitgtk-webdriver | grep "Candidate: [^(]" >/dev/null; then webdriver_pkg=webkitgtk-webdriver; fi
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libsoup-3.0-dev libssl-dev libasound2-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb xdg-utils "$webdriver_pkg"
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      # v9 keeps the caller's service builds and only moves webdriverio + @wdio/* onto the v9 floor.
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      - name: Build Tauri app for protocol registration
        if: ${{ (matrix.test-type == 'deeplink' || matrix.test-type == 'multiremote') && runner.os != 'macOS' }}
        run: pnpm --filter=@wdio-desktop-mobile-example/tauri run build
      - name: Register testapp:// protocol handler
        if: ${{ (matrix.test-type == 'deeplink' || matrix.test-type == 'multiremote') && runner.os != 'macOS' }}
        run: bash packages/tauri/scripts/protocol-install.sh
      - name: Run Tauri CrabNebula tests (Linux)
        if: ${{ runner.os == 'Linux' }}
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          NO_AT_BRIDGE: '1'
          RUST_BACKTRACE: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x16" pnpm run test:tauri:crabnebula:${{ matrix.test-type }}
      - name: Run Tauri CrabNebula tests
        # macOS CrabNebula requires CN_API_KEY. Dependabot PRs can't access repo
        # secrets, so skip just the macOS cell there (Windows needs no key and
        # still runs). Any non-dependabot run with a missing key still fails
        # loudly, surfacing a genuine secret misconfiguration.
        if: ${{ runner.os != 'Linux' && !(runner.os == 'macOS' && github.actor == 'dependabot[bot]' && env.HAS_CN_API_KEY != 'true') }}
        id: test
        # Failure is gated below rather than here, so a known-broken platform
        # warns instead of going red. Linux has no continue-on-error and stays
        # required.
        continue-on-error: true
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          RUST_BACKTRACE: '1'
        run: pnpm run test:tauri:crabnebula:${{ matrix.test-type }}
      - name: 🐛 Show Test Logs on Failure
        shell: bash
        if: ${{ failure() || steps.test.outcome == 'failure' }}
        # Diagnostic output must never decide the job result — that is Check
        # Result's job. Without this the log dump becomes the failure whenever
        # it cannot run, which is exactly what it does on Windows today.
        continue-on-error: true
        run: pnpm --filter=@wdio-desktop-mobile-example/tauri run ci:logs
      - name: ❌ Check Result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          # Two separate known breakages of the CrabNebula driver, neither ours:
          #  - Windows: WebView2 Runtime 150 stopped honouring --remote-debugging-port
          #    for elevated hosts, and runners run as admin.
          #    https://github.com/webdriverio/desktop-mobile/issues/542
          #  - macOS: the macos-26 image (26.4) broke the closed-source driver's
          #    session setup — the session is created, then the first command fails.
          #    https://github.com/webdriverio/desktop-mobile/issues/541
          #
          # Empty outcome means the step was skipped for this OS (Linux runs its own
          # step, which is required) or on a dependabot macOS run with no CN_API_KEY.
          case "$OUTCOME" in
            success|skipped|'')
              echo "Tauri CrabNebula: $OUTCOME" ;;
            failure)
              case "$RUNNER_OS" in
                Windows)
                  echo "::warning::Tauri CrabNebula tests failed (allowed on Windows — WebView2 150 elevated-host regression; see https://github.com/webdriverio/desktop-mobile/issues/542)" ;;
                macOS)
                  echo "::warning::Tauri CrabNebula tests failed (allowed on macOS — macos-26 image broke the CrabNebula driver; see https://github.com/webdriverio/desktop-mobile/issues/541)" ;;
                *)
                  echo "::error::Tauri CrabNebula tests failed"
                  exit 1 ;;
              esac ;;
            *)
              echo "::error::Tauri CrabNebula tests had unexpected outcome: $OUTCOME"
              exit 1 ;;
          esac

  # ────────────────────────────────────────────────────────────────────
  # React Native (mobile, Appium-driven) — per platform, not per provider.
  #
  # Unlike the desktop services, the service doesn't spawn the app: @wdio/appium-service boots
  # Appium, Appium installs + launches the native artifact, and the service attaches to the app's
  # Hermes realm over Metro for execute/mock. Each job builds the fixture once, then runs all three
  # mobile test types (standard, deeplink, contexts) sequentially against one device.
  #
  # Gated off the `minimum` catalog: the service requires webdriverio 9 + Node 22, which the
  # wdio-8-based minimum catalog can't satisfy. Node is 22.x here (the rest of the matrix is 20.x)
  # because the service engine is >=22.12 and the WDIO config uses fs.globSync (Node 22+).
  # ────────────────────────────────────────────────────────────────────
  react-native-android:
    name: react-native-android-${{ matrix.architecture }} ${{ inputs.wdio-major }} (${{ matrix.os }})
    if: inputs.runner-set != 'arm64'
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ["24"]
        architecture: [paper, fabric]
      fail-fast: false
    env:
      # Scaffolded RN project (native android/ + JS). The package's .gitignore ignores it; the WDIO
      # config globs the APK here when RN_APP_PATH is unset, and Metro is served from it.
      RN_BUILD_DIR: ${{ github.workspace }}/packages/react-native/.rn-build
      RN_PLATFORM: android
    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      # Reclaim disk for the Android SDK/emulator/gradle footprint.
      - name: 🧹 Free Disk Space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell /usr/local/share/boost /usr/local/graalvm || true
          sudo docker image prune --all --force || true
      # KVM acceleration for the x86_64 emulator.
      - name: ⚡ Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      # RN 0.76 targets JDK 17 (+ Gradle 8.x).
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      # v9 keeps the caller's service builds and only moves webdriverio + @wdio/* onto the v9 floor.
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      # Scaffold a fresh RN project (native android/ is generated, not committed) and overlay the
      # committed fixture source, then build the debug APK (debug is mandatory — the Hermes inspector
      # execute/mock attach to is debug-only). The architecture matrix builds Paper
      # (newArchEnabled=false) and Fabric (newArchEnabled=true).
      - name: 🏗️ Scaffold native project + build debug APK
        shell: bash
        run: |
          set -euo pipefail
          # Single-source the RN + CLI versions from app/package.json (same as build-app.mjs) so a
          # version bump only touches one file.
          RN_APP_PKG="$GITHUB_WORKSPACE/packages/react-native/app/package.json"
          RN_VERSION=$(node -p "require('$RN_APP_PKG').dependencies['react-native']")
          RN_CLI=$(node -p "require('$RN_APP_PKG').devDependencies['@react-native-community/cli']")
          npx --yes "@react-native-community/cli@$RN_CLI" init ReactNativeE2EApp \
            --version "$RN_VERSION" --directory "$RN_BUILD_DIR" --skip-git-init --pm npm --install-pods false
          for f in App.tsx index.js app.json metro.config.js babel.config.js; do
            cp "packages/react-native/app/$f" "$RN_BUILD_DIR/$f"
          done
          sed -i "s/^newArchEnabled=.*/newArchEnabled=${{ matrix.architecture == 'fabric' && 'true' || 'false' }}/" "$RN_BUILD_DIR/android/gradle.properties"
          grep '^newArchEnabled=' "$RN_BUILD_DIR/android/gradle.properties"
          ( cd "$RN_BUILD_DIR/android" && ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64 )
          echo "RN_APP_PATH=$RN_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
      # Idempotent: appium exits 1 if the driver is already registered in APPIUM_HOME.
      - name: 🔌 Install Appium UiAutomator2 driver
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter=@wdio-desktop-mobile-example/react-native exec appium driver list --installed 2>&1 | grep -qi uiautomator2; then
            echo "uiautomator2 driver already installed"
          else
            pnpm --filter=@wdio-desktop-mobile-example/react-native exec appium driver install uiautomator2@8
          fi
      - name: 🤖 Run E2E on Android emulator
        # Third-party action → pinned to a full commit SHA (this job has secret access via inherit).
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # android-emulator-runner runs this with dash (no pipefail) → use POSIX-safe `set -eu`.
          script: |
            set -eu
            # Map emulator:8081 → host:8081 so the debug bundle load and the Hermes inspector attach
            # both reach Metro on the runner host.
            adb reverse tcp:8081 tcp:8081
            ( cd "$RN_BUILD_DIR" && npx react-native start --port 8081 > "$GITHUB_WORKSPACE/packages/react-native/metro.log" 2>&1 & )
            pnpm --filter=@wdio-desktop-mobile-example/react-native exec wait-on tcp:8081 --timeout 120000
            # Run wdio directly (like the upstream e2e suite), NOT via the root turbo scripts —
            # Turbo's task wrapper interferes with the long-lived Appium server + emulator session.
            # deeplink is intentionally NOT run in CI (mirrors upstream): the fixture registers no
            # URL scheme, so triggerDeeplink's am-start fallback can't resolve. Kept for manual runs.
            pnpm --filter=@wdio-desktop-mobile-example/react-native run test
            pnpm --filter=@wdio-desktop-mobile-example/react-native run test:contexts
      - name: 🐛 Show Metro log on failure
        if: failure()
        shell: bash
        run: tail -n 200 packages/react-native/metro.log || true
      - name: 🐛 Show Test Logs on Failure
        if: failure()
        shell: bash
        run: pnpm --filter=@wdio-desktop-mobile-example/react-native run ci:logs

  react-native-ios:
    name: react-native-ios-${{ matrix.architecture }} ${{ inputs.wdio-major }} (${{ matrix.os }})
    if: inputs.runner-set != 'arm64'
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    # Cap a hung Appium/WDA session (a stuck session-create can otherwise idle the macOS runner).
    timeout-minutes: 75
    strategy:
      matrix:
        # Pinned to macos-15 (Xcode 16 + iOS 18 simulators) rather than macos-latest: on the
        # bleeding-edge macos-26 / iOS 26 image, appium-xcuitest hits the #359 "unknown to
        # FrontBoard" app-launch flake consistently. iOS 18 is well-supported by appium-xcuitest 11.x.
        os: [macos-15]
        node-version: ["24"]
        architecture: [paper, fabric]
      fail-fast: false
    env:
      RN_BUILD_DIR: ${{ github.workspace }}/packages/react-native/.rn-build
      RN_PLATFORM: ios
      RN_IOS_DEVICE: 'iPhone 16'
    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      # v9 keeps the caller's service builds and only moves webdriverio + @wdio/* onto the v9 floor.
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      # Scaffold, install pods (New Architecture / Fabric — the RN 0.76 default), and build the
      # simulator .app once. Debug build is mandatory (Hermes inspector). Unlike upstream we keep
      # build + e2e in one job and let appium
      # compile WebDriverAgent on the first session — the WDIO config's generous wdaLaunchTimeout /
      # connectionRetryTimeout (when RN_WDA_DD is unset) absorb that, trading speed for fewer moving
      # parts than the prebuilt-WDA artifact dance.
      - name: 📱 Build iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          # Single-source the RN + CLI versions from app/package.json (same as build-app.mjs) so a
          # version bump only touches one file.
          RN_APP_PKG="$GITHUB_WORKSPACE/packages/react-native/app/package.json"
          RN_VERSION=$(node -p "require('$RN_APP_PKG').dependencies['react-native']")
          RN_CLI=$(node -p "require('$RN_APP_PKG').devDependencies['@react-native-community/cli']")
          npx --yes "@react-native-community/cli@$RN_CLI" init ReactNativeE2EApp \
            --version "$RN_VERSION" --directory "$RN_BUILD_DIR" --skip-git-init --pm npm --install-pods false
          for f in App.tsx index.js app.json metro.config.js babel.config.js; do
            cp "packages/react-native/app/$f" "$RN_BUILD_DIR/$f"
          done
          ( cd "$RN_BUILD_DIR/ios" && RCT_NEW_ARCH_ENABLED=${{ matrix.architecture == 'fabric' && '1' || '0' }} pod install )
          ( cd "$RN_BUILD_DIR/ios" && xcodebuild \
              -workspace ReactNativeE2EApp.xcworkspace \
              -scheme ReactNativeE2EApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO 2>&1 | (xcbeautify || cat) )
          APP_PATH="$RN_BUILD_DIR/ios/build/Build/Products/Debug-iphonesimulator/ReactNativeE2EApp.app"
          test -d "$APP_PATH" || { echo "::error::iOS .app not found at $APP_PATH"; exit 1; }
          echo "RN_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
      # Warm the toolchain so appium-xcuitest's in-session `xcrun --show-sdk-version` probe is instant.
      - name: 🔥 Warm Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available >/dev/null
      # Resolve + boot a concrete UDID and pin appium:udid to it (RN_IOS_UDID) so appium can't boot a
      # different same-named instance — the proven first-session flake.
      - name: 📲 Boot iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r --arg name "$RN_IOS_DEVICE" \
                'first(.devices | to_entries | sort_by(.key) | reverse | .[].value[] | select(.name == $name) | .udid) // empty')
          test -n "$UDID" || { echo "::error::No available simulator named '$RN_IOS_DEVICE'"; xcrun simctl list devices available; exit 1; }
          echo "RN_IOS_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/tmp/boot.err || grep -qiE "already booted|current state: Booted" /tmp/boot.err
          xcrun simctl bootstatus "$UDID" -b
      - name: 🔌 Install Appium XCUITest driver
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter=@wdio-desktop-mobile-example/react-native exec appium driver list --installed 2>&1 | grep -qi xcuitest; then
            echo "xcuitest driver already installed"
          else
            pnpm --filter=@wdio-desktop-mobile-example/react-native exec appium driver install xcuitest@12
          fi
      - name: 🧪 Run E2E on iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          # Metro serves the JS bundle + Hermes inspector; the simulator reaches it over the shared
          # host loopback (no adb-reverse equivalent needed on iOS).
          ( cd "$RN_BUILD_DIR" && npx react-native start --port 8081 > "$GITHUB_WORKSPACE/packages/react-native/metro.log" 2>&1 & )
          pnpm --filter=@wdio-desktop-mobile-example/react-native exec wait-on tcp:8081 --timeout 120000
          # Pre-bundle: Metro compiles lazily on first request (~60s cold); force it now so the first
          # app launch doesn't land on the "Bundling…" overlay with an empty tree.
          curl -fsS --max-time 300 "http://localhost:8081/index.bundle?platform=ios&dev=true&minify=false" -o /dev/null \
            && echo "Metro bundle pre-built" || echo "::warning::Metro pre-bundle request failed (continuing)"
          # Run wdio directly (like the upstream e2e suite), NOT via the root turbo scripts.
          # deeplink is intentionally NOT run in CI (mirrors upstream): the fixture registers no URL
          # scheme, so triggerDeeplink can't resolve. Kept for manual runs.
          pnpm --filter=@wdio-desktop-mobile-example/react-native run test
          pnpm --filter=@wdio-desktop-mobile-example/react-native run test:contexts
      - name: 🐛 Show Metro log on failure
        if: failure()
        shell: bash
        run: tail -n 200 packages/react-native/metro.log || true
      - name: 🐛 Show Test Logs on Failure
        if: failure()
        shell: bash
        run: pnpm --filter=@wdio-desktop-mobile-example/react-native run ci:logs

  # ────────────────────────────────────────────────────────────────────
  # Flutter (mobile, Appium-driven via appium-flutter-driver). Like React Native, Appium owns the
  # session — but a Flutter debug build is self-contained: no Metro / JS-bundle server, no
  # adb-reverse. Find/tap runs over appium-flutter-driver's FLUTTER context.
  #
  # `wdio_flutter` is not on pub.dev (webdriverio/desktop-mobile#479). The fixture takes it from
  # packages/flutter-bridge at the mirrored upstream revision, so execute/mock/emitEvent run here.
  # deeplink stays out of CI: the fixture registers no URL scheme.
  #
  # The Flutter SDK is pinned to 3.35.6.
  # ────────────────────────────────────────────────────────────────────
  flutter-android:
    name: flutter-android ${{ inputs.wdio-major }} (${{ matrix.os }})
    if: inputs.runner-set != 'arm64'
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ["24"]
      fail-fast: false
    env:
      # Scaffolded Flutter project (native android/ + Dart). The package's .gitignore ignores it; the
      # WDIO config globs the APK here when FLUTTER_APP_PATH is unset.
      FLUTTER_BUILD_DIR: ${{ github.workspace }}/packages/flutter/.flutter-build
      FLUTTER_PLATFORM: android
    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      # Reclaim disk for the Android SDK/emulator/gradle + Flutter SDK footprint. Keep
      # /usr/local/lib/android — this job needs the Android SDK.
      - name: 🧹 Free Disk Space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell /usr/local/share/boost /usr/local/graalvm || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
      - name: ⚡ Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      # Flutter 3.35 targets JDK 17 (Gradle 8.x) for the Android build.
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      # Third-party action → pinned to a full commit SHA (matches the android-emulator-runner pin).
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      # v9 keeps the caller's service builds and only moves webdriverio + @wdio/* onto the v9 floor.
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      # Scaffold the Android platform project over the committed source-only fixture, overlay our
      # lib/main.dart + pubspec.yaml (flutter create can overwrite them), and build a debug APK
      # (--target-platform android-x64 for the x86_64 emulator). Strip ndkVersion so Gradle doesn't
      # auto-download the ~1GB NDK (the fixture has no native code). Debug is required:
      # execute/mock attach to the Dart VM Service, which a release build does not expose.
      - name: 🏗️ Scaffold + build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/packages/flutter"
          flutter create --org com.wdio --project-name wdio_flutter_fixture --platforms=android "$FLUTTER_BUILD_DIR"
          cp app/lib/main.dart "$FLUTTER_BUILD_DIR/lib/main.dart"
          cp app/pubspec.yaml "$FLUTTER_BUILD_DIR/pubspec.yaml"
          find "$FLUTTER_BUILD_DIR/android" -name 'build.gradle*' -exec sed -i '/ndkVersion/d' {} +
          ( cd "$FLUTTER_BUILD_DIR" && flutter pub get && flutter build apk --debug --target-platform android-x64 )
          echo "FLUTTER_APP_PATH=$FLUTTER_BUILD_DIR/build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_ENV"
      # appium-flutter-driver is a meta-driver — it bundles uiautomator2/xcuitest. Idempotent: appium
      # exits 1 if the driver is already registered in APPIUM_HOME.
      - name: 🔌 Install Appium Flutter driver
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter=@wdio-desktop-mobile-example/flutter exec appium driver list --installed 2>&1 | grep -qi flutter; then
            echo "flutter driver already installed"
          else
            pnpm --filter=@wdio-desktop-mobile-example/flutter exec appium driver install --source=npm appium-flutter-driver@4
          fi
      - name: 🤖 Run E2E on Android emulator
        # Third-party action → pinned to a full commit SHA, not a floating tag.
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # android-emulator-runner runs this with dash (no pipefail) → POSIX-safe `set -eu`.
          script: |
            set -eu
            # Flutter debug builds are self-contained (no Metro / adb-reverse needed).
            # deeplink is not run in CI: the fixture registers no URL scheme.
            pnpm --filter=@wdio-desktop-mobile-example/flutter run test
            pnpm --filter=@wdio-desktop-mobile-example/flutter run test:contexts
      - name: 🐛 Show Test Logs on Failure
        if: failure()
        shell: bash
        run: pnpm --filter=@wdio-desktop-mobile-example/flutter run ci:logs

  flutter-ios:
    name: flutter-ios ${{ inputs.wdio-major }} (${{ matrix.os }})
    if: inputs.runner-set != 'arm64'
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    # Cap a hung Appium/WDA session (a stuck session-create can otherwise idle the macOS runner).
    timeout-minutes: 75
    strategy:
      matrix:
        # Pinned to macos-15 (Xcode 16 / iOS 18), not macos-latest: on the bleeding-edge iOS 26
        # image appium-xcuitest hits the "unknown to FrontBoard" launch flake (same as the RN job).
        os: [macos-15]
        node-version: ["24"]
      fail-fast: false
    env:
      FLUTTER_BUILD_DIR: ${{ github.workspace }}/packages/flutter/.flutter-build
      FLUTTER_PLATFORM: ios
      FLUTTER_IOS_DEVICE: 'iPhone 16'
    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      # v9 keeps the caller's service builds and only moves webdriverio + @wdio/* onto the v9 floor.
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      # Scaffold the iOS platform project over the committed source-only fixture, overlay our source,
      # and build the simulator .app (debug, no codesign). `flutter build ios` runs pod install
      # itself. We let appium compile WebDriverAgent on the first session (no FLUTTER_WDA_DD) — the
      # config's generous wdaLaunchTimeout / connectionRetryTimeout absorb it.
      - name: 📱 Build iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/packages/flutter"
          flutter create --org com.wdio --project-name wdio_flutter_fixture --platforms=ios "$FLUTTER_BUILD_DIR"
          cp app/lib/main.dart "$FLUTTER_BUILD_DIR/lib/main.dart"
          cp app/pubspec.yaml "$FLUTTER_BUILD_DIR/pubspec.yaml"
          ( cd "$FLUTTER_BUILD_DIR" && flutter pub get && flutter build ios --debug --simulator --no-codesign )
          APP_PATH=$(ls -d "$FLUTTER_BUILD_DIR"/build/ios/iphonesimulator/*.app | head -n1)
          test -d "$APP_PATH" || { echo "::error::iOS .app not found under $FLUTTER_BUILD_DIR/build/ios/iphonesimulator"; exit 1; }
          echo "FLUTTER_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
      # Warm the toolchain so appium-xcuitest's in-session `xcrun --show-sdk-version` probe is instant.
      - name: 🔥 Warm Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available >/dev/null
      # Resolve + boot a concrete UDID and pin appium:udid to it (FLUTTER_IOS_UDID) so appium can't
      # boot a different same-named instance — the proven first-session flake.
      - name: 📲 Boot iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r --arg name "$FLUTTER_IOS_DEVICE" \
                'first(.devices | to_entries | sort_by(.key) | reverse | .[].value[] | select(.name == $name) | .udid) // empty')
          test -n "$UDID" || { echo "::error::No available simulator named '$FLUTTER_IOS_DEVICE'"; xcrun simctl list devices available; exit 1; }
          echo "FLUTTER_IOS_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/tmp/boot.err || grep -qiE "already booted|current state: Booted" /tmp/boot.err
          xcrun simctl bootstatus "$UDID" -b
      - name: 🔌 Install Appium Flutter driver
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter=@wdio-desktop-mobile-example/flutter exec appium driver list --installed 2>&1 | grep -qi flutter; then
            echo "flutter driver already installed"
          else
            pnpm --filter=@wdio-desktop-mobile-example/flutter exec appium driver install --source=npm appium-flutter-driver@4
          fi
      - name: 🧪 Run E2E on iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          # Flutter debug builds are self-contained (no Metro). deeplink is not run in CI
          # (the fixture registers no URL scheme).
          pnpm --filter=@wdio-desktop-mobile-example/flutter run test
          pnpm --filter=@wdio-desktop-mobile-example/flutter run test:contexts
      - name: 🐛 Show Test Logs on Failure
        if: failure()
        shell: bash
        run: pnpm --filter=@wdio-desktop-mobile-example/flutter run ci:logs

  # ────────────────────────────────────────────────────────────────────
  # Electrobun. macOS is standard only (CEF can't isolate instances).
  # Windows runs standard, window and multiremote. Linux runs standard
  # and multiremote. No deeplink cells: webdriverio/desktop-mobile#320.
  # ────────────────────────────────────────────────────────────────────
  electrobun:
    name: electrobun-${{ matrix.test-type }} ${{ inputs.wdio-major }} (${{ matrix.os }})
    runs-on: ${{ inputs.runner-set == 'arm64' && (matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || matrix.os == 'windows-latest' && 'windows-11-arm' || matrix.os) || matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.runner-set == 'arm64' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node-version: ["24"]
        test-type: [standard, window, multiremote]
        exclude:
          # macOS CEF can't isolate instances, so only standard runs there.
          - { os: macos-latest, test-type: window }
          - { os: macos-latest, test-type: multiremote }
          # Linux has no window cell.
          - { os: ubuntu-latest, test-type: window }
    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          webdriver_pkg=webkit2gtk-driver
          if apt-cache policy webkitgtk-webdriver | grep "Candidate: [^(]" >/dev/null; then webdriver_pkg=webkitgtk-webdriver; fi
          sudo apt-get install -y \
            xvfb \
            "$webdriver_pkg" \
            libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libasound2t64 \
            libxkbcommon0 \
            libxdamage1 \
            libxrandr2 \
            libxcomposite1 \
            libxfixes3
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      - name: Build Electrobun app
        run: pnpm --filter=@wdio-desktop-mobile-example/electrobun run build
      - name: De-elevation setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements --disable-interactivity
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH','User')
          $gsudo = (Get-Command gsudo -ErrorAction Stop).Source
          Split-Path $gsudo | Add-Content -Path $env:GITHUB_PATH
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F"
      - name: Run Electrobun tests
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm --filter=@wdio-desktop-mobile-example/electrobun run test
      - name: Run Electrobun tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TEST_TYPE: ${{ matrix.test-type }}
        run: |
          script=test
          if [ "$TEST_TYPE" != standard ]; then script="test:${TEST_TYPE}"; fi
          xvfb-run -a pnpm --filter=@wdio-desktop-mobile-example/electrobun run "$script"
      - name: Run Electrobun tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_TYPE: ${{ matrix.test-type }}
        run: |
          $script = "test"
          if ($env:TEST_TYPE -ne "standard") { $script = "test:$env:TEST_TYPE" }
          gsudo --integrity Medium pwsh -NoProfile -Command "pnpm --filter=@wdio-desktop-mobile-example/electrobun run $script"
      - name: Show Test Logs on Failure
        if: failure()
        shell: bash
        run: pnpm --filter=@wdio-desktop-mobile-example/electrobun run ci:logs

  # Browser mode is Linux-only upstream: Chrome against a static page, no native app.
  browser-mode:
    name: browser-${{ matrix.framework }} ${{ inputs.wdio-major }}
    runs-on: ${{ inputs.runner-set == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [electron, tauri, dioxus]
        node-version: ["24"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      # display-server 9.32.0 ships no build, so v9 needs a job-wide Xvfb.
      # https://github.com/webdriverio/desktop-mobile/pull/1011
      - name: Run browser-mode tests
        if: inputs.wdio-major != 'v9'
        run: pnpm --filter=@wdio-desktop-mobile-example/${{ matrix.framework }}-browser run test
      - name: Run browser-mode tests (v9, job-wide Xvfb)
        if: inputs.wdio-major == 'v9'
        run: xvfb-run -a pnpm --filter=@wdio-desktop-mobile-example/${{ matrix.framework }}-browser run test
      - name: Show Test Logs on Failure
        if: failure()
        shell: bash
        run: pnpm --filter=@wdio-desktop-mobile-example/${{ matrix.framework }}-browser run ci:logs

  electron-mac-universal:
    name: electron-mac-universal ${{ inputs.wdio-major }}
    if: inputs.runner-set != 'arm64'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Cache pnpm modules
        uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-${{ inputs.wdio-major }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ env.cache-name }}-${{ matrix.node-version }}-${{ inputs.catalog }}-
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      - name: Switch WebdriverIO to v9
        if: ${{ inputs.wdio-major == 'v9' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts minimum --wdio-only
      - name: Build universal binaries
        run: |
          pnpm --filter=@wdio-desktop-mobile-example/electron-builder run build:mac-universal
          pnpm --filter=@wdio-desktop-mobile-example/electron-forge run build:mac-universal
      - name: Verify both architectures
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local bin="$1"
            echo "Checking $bin"
            lipo -info "$bin"
            local info
            info=$(lipo -info "$bin")
            case "$info" in
              *x86_64*) ;;
              *) echo "::error::Missing x86_64 in $bin"; exit 1 ;;
            esac
            case "$info" in
              *arm64*) ;;
              *) echo "::error::Missing arm64 in $bin"; exit 1 ;;
            esac
          }
          builder=$(find packages/electron-builder/dist-electron/mac-universal -type f -name electron-builder-e2e-app | head -n 1)
          forge=$(find packages/electron-forge/out -type f -path '*darwin-universal*' -name electron-forge-e2e-app | head -n 1)
          test -n "$builder" || { echo "::error::builder universal binary not found"; find packages/electron-builder/dist-electron -maxdepth 3 -type d; exit 1; }
          test -n "$forge" || { echo "::error::forge universal binary not found"; find packages/electron-forge/out -maxdepth 3 -type d; exit 1; }
          check "$builder"
          check "$forge"

  lint:
    name: lint ${{ inputs.wdio-major }}
    if: inputs.wdio-major == 'v10' && inputs.runner-set != 'arm64'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r manifest; do
            if ! cargo fmt --check --manifest-path "$manifest"; then
              echo "::error file=$manifest::Run cargo fmt --manifest-path $manifest"
              status=1
            fi
          done < <(git ls-files '*Cargo.toml')
          exit "$status"

  typecheck:
    name: typecheck ${{ inputs.wdio-major }}
    if: inputs.wdio-major == 'v10' && inputs.runner-set != 'arm64'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies (frozen)
        if: ${{ inputs.catalog == 'default' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (refresh latest)
        if: ${{ inputs.catalog == 'default' && github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Switch to ${{ inputs.catalog }} catalog
        if: ${{ inputs.catalog != 'default' }}
        shell: bash
        run: pnpm dlx tsx scripts/switch-catalog.ts ${{ inputs.catalog }}
      - name: Typecheck
        run: pnpm typecheck
