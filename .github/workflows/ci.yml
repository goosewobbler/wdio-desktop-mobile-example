name: CI

# Stable caller. v10 and v9 start together. v9 keeps these service builds and
# only moves webdriverio and @wdio/* onto the v9 floor.
on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  v10:
    name: v10
    uses: ./.github/workflows/_ci.reusable.yml
    with:
      catalog: default
      wdio-major: v10
    secrets: inherit
  v9:
    name: v9
    uses: ./.github/workflows/_ci.reusable.yml
    with:
      catalog: default
      wdio-major: v9
    secrets: inherit
