name: wdio_flutter_fixture
description: E2E fixture app for @wdio/flutter-service (example repo; find/tap subset).
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # enableFlutterDriverExtension() — required for the FLUTTER context (appium-flutter-driver).
  flutter_driver:
    sdk: flutter
  # Drop the git pin once wdio_flutter publishes to pub.dev (webdriverio/desktop-mobile#479).
  wdio_flutter:
    git:
      url: https://github.com/webdriverio/desktop-mobile.git
      ref: 727f8c3d1214921edfe4c85f39b41f1d16122665
      path: packages/flutter-bridge

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
