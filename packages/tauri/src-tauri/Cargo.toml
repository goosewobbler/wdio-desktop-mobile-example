[package]
name = "tauri-e2e-app"
version = "0.1.0"
publish = false
description = "A basic Tauri app for testing"
authors = ["WebDriverIO Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-fs = "2.7.1"
# Workaround for tauri-apps/plugins-workspace#3710; drop once a deep-link release builds
# against rust-ini 0.21.3. 2.6.2 constructs ini::ParseOption without the fields that version added.
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Drop the git pins once crates.io publishes tauri-plugin-wdio 2.0.0-next
# (webdriverio/desktop-mobile release:prerelease, releasekit does not publish these yet).
tauri-plugin-wdio = { git = "https://github.com/webdriverio/desktop-mobile", rev = "727f8c3d1214921edfe4c85f39b41f1d16122665" }
tauri-plugin-wdio-webdriver = { git = "https://github.com/webdriverio/desktop-mobile", rev = "727f8c3d1214921edfe4c85f39b41f1d16122665" }
tauri-plugin-automation = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30.5"
clipboard = "0.5.0"
once_cell = "1.19"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
